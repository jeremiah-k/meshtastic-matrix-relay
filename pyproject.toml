[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrelay"
version = "1.5.0"
description = "Bridge between Meshtastic mesh networks and Matrix chat rooms"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Geoff Whittington" }, { name = "Jeremiah K." }]
maintainers = [{ name = "Jeremiah K.", email = "jeremiahk@gmx.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Topic :: Communications",
]
dependencies = [
  "mtjk==2.7.11.post14",
  "Pillow==13.0.0",
  "segno==1.6.6",
  "aiohttp==3.14.5",
  "mindroom-nio==1.3.0",
  # Unpublished MEDRE 0.1 core and Matrix codec, pinned to landed main revisions.
  # Repin the core to its frozen-release commit before tagging MMRelay 1.5.0.
  "medre @ git+https://github.com/jeremiah-k/medre.git@21111445f3e4096efa956a5e14af7481061b0c7a",
  "medre-adapter-matrix @ git+https://github.com/jeremiah-k/medre-adapter-matrix.git@abd59e9e810ad5cf106e385678e5924c2535e2b6",
  "matplotlib==3.11.2",
  "requests==2.34.2",
  "markdown==3.11.3",
  "nh3==0.3.7",
  "haversine==2.9.0",
  "schedule==1.2.2",
  "platformdirs==4.14.5",
  "py-staticmaps==0.5.0",
  "psutil==7.2.2",
  "rich==15.0.0",
]

[project.optional-dependencies]
e2e = ["mindroom-nio[e2e]==1.3.0"]
test = [
  "coverage==7.17.2",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-env==1.8.5",
  "pytest-timeout==2.4.0",
]
dev = [
  "mypy==2.4.1",
  "pyright==1.1.414",
  "types-PyYAML==6.0.12.20261111",
  "types-Markdown==3.11.3.20261108",
  "types-jsonschema==4.26.0.20261006",
]

[project.urls]
Homepage = "https://github.com/jeremiah-k/meshtastic-matrix-relay"
Repository = "https://github.com/jeremiah-k/meshtastic-matrix-relay"
Issues = "https://github.com/jeremiah-k/meshtastic-matrix-relay/issues"

[project.scripts]
mmrelay = "mmrelay.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mmrelay.tools" = ["*.yaml", "*.service", "*.env"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

# uv is used for development environments only; pip and pipx installs of the
# published package are unaffected. Keep the floor in sync with the lockfile
# revision uv.lock requires.
[tool.uv]
required-version = ">=0.12.22"
