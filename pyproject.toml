[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrelay"
version = "1.4.1"
description = "Bridge between Meshtastic mesh networks and Matrix chat rooms"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Geoff Whittington" }, { name = "Jeremiah K." }]
maintainers = [{ name = "Jeremiah K.", email = "jeremiahk@gmx.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Topic :: Communications",
]
dependencies = [
  "mtjk @ git+https://github.com/jeremiah-k/mtjk.git@develop",
  "Pillow==12.3.0",
  "segno==1.6.6",
  "aiohttp==3.14.4",
  "mindroom-nio==0.40.0; python_version < '3.12'",
  "mindroom-nio==1.1.4; python_version >= '3.12'",
  "matplotlib==3.11.2",
  "requests==2.34.2",
  "markdown==3.11",
  "nh3==0.3.7",
  "haversine==2.9.0",
  "schedule==1.2.2",
  "platformdirs==4.12.4",
  "py-staticmaps==0.5.0",
  "psutil==7.2.2",
  "rich==15.0.0",
]

[project.optional-dependencies]
e2e = [
  "mindroom-nio[e2e]==0.40.0; python_version < '3.12'",
  "mindroom-nio[e2e]==1.1.4; python_version >= '3.12'",
]
test = [
  "coverage==7.16.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "pytest-env==1.7.1",
  "pytest-timeout==2.5.0",
]
dev = [
  "mypy==2.4.0",
  "pyright==1.1.414",
  "types-PyYAML==6.0.12.20260906",
  "types-Markdown==3.10.2.20261007",
  "types-jsonschema==4.26.0.20261006",
]

[project.urls]
Homepage = "https://github.com/jeremiah-k/meshtastic-matrix-relay"
Repository = "https://github.com/jeremiah-k/meshtastic-matrix-relay"
Issues = "https://github.com/jeremiah-k/meshtastic-matrix-relay/issues"

[project.scripts]
mmrelay = "mmrelay.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mmrelay.tools" = ["*.yaml", "*.service", "*.env"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]
