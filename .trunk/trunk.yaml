# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    # pinact stays on 4.x: the plugins v1.11.0 wrapper still passes the
    # single-dash -format flag that pinact v5 rejected.
    - pinact@4.0.0
    - renovate@44.148.1
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - mypy@2.4.0
    - pyright@1.1.414
    - dotenv-linter@4.0.0
    - hadolint@2.15.1
    - taplo@0.10.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.0
    - checkov@3.3.26
    - git-diff-check
    - isort@9.0.2
    - markdownlint@0.49.1
    - osv-scanner@2.6.0
    - prettier@3.9.9
    - ruff@0.16.10
    - trufflehog@3.99.2
    - yamllint@1.38.0
  definitions:
    - name: bandit
      direct_configs:
        - .bandit.yaml
      commands:
        - name: lint
          run: bandit --exit-zero -c .bandit.yaml --format json --output ${tmpfile} ${target}
          read_output_from: tmp_file
  ignore:
    - linters: [ALL]
      paths:
        - src/mmrelay/tools/sample_config.yaml
        - src/mmrelay/plugins/map_plugin.py
    - linters: [dotenv-linter]
      paths:
        - src/mmrelay/tools/sample.env
    - linters: [prettier, yamllint]
      paths:
        - src/mmrelay/tools/k8s/*.yaml
        - src/mmrelay/tools/k8s/*.yaml.tpl
        - deploy/helm/mmrelay/templates/*.yaml
    - linters: [bandit]
      paths:
        - src/mmrelay/setup_utils.py
        - src/mmrelay/cli_utils.py # Ignore B110 for client close error handling during logout
        - src/mmrelay/migrate.py # Ignore B603 for safe subprocess.run with validated pgrep path
    - linters: [mypy]
      paths:
        - tests/** # Type checking is scoped to src/; tests are out of scope
    - linters: [markdownlint, prettier]
      paths:
        - session-*.md # Session logs are raw artifacts, not project docs
actions:
  disabled:
    - trunk-announce
  enabled:
    - trunk-upgrade-available
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
