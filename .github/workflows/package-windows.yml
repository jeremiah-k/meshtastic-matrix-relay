name: Package Windows Installer

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    branches: [main, develop, "**-review"]
    paths:
      - .github/workflows/package-windows.yml
      - scripts/mmrelay.iss
      - scripts/build_plugin_python.py
      - scripts/ci/smoke_frozen_plugins.py
      - scripts/ci/smoke_windows_upgrade.py
      - scripts/ci/smoke_windows_oauth.py
      - tests/oauth_helpers.py
      - scripts/ci/smoke_installer_yaml.py
      - src/**

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # 3.14, not 3.15: bleak's winrt-* dependencies publish no cp315
          # wheels, and their sdist builds fail on the runner (LNK1104),
          # aborting the entire dependency install. Revisit once cp315
          # wheels ship.
          python-version: 3.14

      - name: Validate release tag against package version
        if: ${{ github.event_name == 'release' }}
        run: python scripts/ci/validate_release_version.py --tag "${{ github.event.release.tag_name }}"

      - name: Extract version and git SHA
        id: get_version
        shell: bash
        run: |
          set -euo pipefail

          # Extract version from pyproject.toml
          VERSION="$(
            python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          )"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracted version: $VERSION"
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "GIT_SHA=$GIT_SHA" >> "$GITHUB_ENV"
          # Set FILE_VERSION to just the version for releases, or version-dev-SHA for PRs/manual runs
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "FILE_VERSION=$VERSION" >> "$GITHUB_ENV"
          else
            echo "FILE_VERSION=$VERSION-dev-$GIT_SHA" >> "$GITHUB_ENV"
          fi

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Assemble isolated plugin Python runtime
        run: python scripts/build_plugin_python.py --output build/plugin-python

      - name: Build executable
        # --collect-submodules meshtastic: mtjk lazy-loads BLE runtime modules
        # (receive_compat_service, lifecycle_service) through importlib, which
        # PyInstaller's static analysis cannot see.
        # --copy-metadata mmrelay: the frozen app reads its version through
        # importlib.metadata, which needs the dist-info inside the bundle.
        # The private runtime supplies a real interpreter for plugin wheel
        # installs; sys.executable in the frozen app points to mmrelay.exe.
        run: pyinstaller --name=mmrelay.exe --onefile --console --collect-all rich --collect-submodules meshtastic --copy-metadata mmrelay --add-data "build/plugin-python:plugin-python" src/mmrelay/main.py

      - name: Smoke test — verify executable runs
        run: .\dist\mmrelay.exe --version

      - name: Prepare offline pure and native plugin wheels
        run: python scripts/ci/smoke_frozen_plugins.py --prepare --home build/plugin-smoke-home

      - name: Build frozen plugin smoke harness
        # Import the production entrypoint and use the same collection options.
        # Keep this test executable out of the installer and release artifacts.
        run: pyinstaller --name=plugin-smoke --onefile --console --collect-all rich --collect-submodules meshtastic --copy-metadata mmrelay --add-data "build/plugin-python:plugin-python" scripts/ci/smoke_frozen_plugins.py

      - name: Smoke test — install pure and native plugin wheels
        run: .\dist\plugin-smoke.exe --home build/plugin-smoke-home

      - name: Smoke test — reuse plugin dependencies after restart
        run: .\dist\plugin-smoke.exe --home build/plugin-smoke-home --verify-only

      - name: Build installer
        # Intentionally using a SHA-pinned action that supports `filepath` + `options`.
        # Keep this pinned to control supply-chain risk and avoid interface drift.
        uses: sharktide/iscc-cli@c94f2cbc0fc82dede0efad402dca3dfa3a1ede2a # 1.0.0
        with:
          filepath: ./scripts/mmrelay.iss
          options: "/DAppVersion=${{ env.FILE_VERSION }}"

      - name: Smoke test — round-trip installer YAML on Windows
        run: python scripts/ci/smoke_installer_yaml.py

      - name: Smoke test — migrate an installed legacy Windows home
        env:
          PYTHONUTF8: "1"
        run: python scripts/ci/smoke_windows_upgrade.py --installer "scripts/MMRelay_setup_${{ env.FILE_VERSION }}.exe"

      - name: Smoke test — native OAuth login, renewal, and logout on Windows
        run: python -m scripts.ci.smoke_windows_oauth

      - name: Upload installer as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MMRelay_setup_${{ env.FILE_VERSION }}
          path: scripts/MMRelay_setup_${{ env.FILE_VERSION }}.exe

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: scripts/MMRelay_setup_${{ env.FILE_VERSION }}.exe
          asset_name: MMRelay_setup_${{ env.FILE_VERSION }}.exe
          tag: ${{ github.ref }}
          overwrite: true
