name: Tests and Coverage

on:
  push:
    branches: [main, develop, "**-review"]
  pull_request:
    branches:
      - main
      - develop
      - "**-review"
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Full commit SHA from jeremiah-k/mindroom-nio (Python 3.12+ only)
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Canary for the ubuntu-latest rollover to 26.04: exercise the
          # GA image continuously so the eventual pin flip is evidence-based.
          - os: ubuntu-26.04
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-uv-
            ${{ runner.os }}-uv-

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --locked --extra test --extra e2e

      - name: Validate candidate Matrix SDK revision
        if: inputs.sdk_ref != ''
        shell: bash
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
        run: '[[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "sdk_ref must be a full commit SHA"; exit 1; }'

      - name: Checkout candidate Matrix SDK
        if: inputs.sdk_ref != '' && matrix.python-version != '3.11'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeremiah-k/mindroom-nio
          ref: ${{ inputs.sdk_ref }}
          path: .sdk
          persist-credentials: false

      - name: Install candidate SDK within locked dependency constraints
        if: inputs.sdk_ref != '' && matrix.python-version != '3.11'
        shell: bash
        run: |
          uv export --locked --extra test --extra e2e --no-emit-project --no-emit-package mindroom-nio --format requirements-txt --output-file "$RUNNER_TEMP/sdk-constraints.txt"
          uv pip install --python .venv/bin/python --constraint "$RUNNER_TEMP/sdk-constraints.txt" './.sdk[e2e]'
          .venv/bin/python - <<'PYCODE'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          source = json.loads(distribution("mindroom-nio").read_text("direct_url.json") or "{}")
          assert source.get("url") == Path(".sdk").resolve().as_uri(), source
          PYCODE
          sdk_sha=$(git -C .sdk rev-parse HEAD)
          echo "Candidate SDK: ${sdk_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Matrix provider selection and dependency consistency
        run: |
          # `uv sync` creates .venv without activating it, so name the
          # interpreter explicitly. A bare `uv pip check` would otherwise
          # target whatever the runner resolves and can pass vacuously.
          uv pip check --python .venv/bin/python
          uv run --no-sync python - <<'PY'
          import tomllib
          from importlib.metadata import version
          from packaging.requirements import Requirement

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          entries = list(project["dependencies"])
          entries += project["optional-dependencies"]["e2e"]
          selected = {
              str(req.specifier)
              for raw in entries
              for req in [Requirement(raw)]
              if req.name == "mindroom-nio"
              and (req.marker is None or req.marker.evaluate())
          }
          assert len(selected) == 1, f"conflicting mindroom-nio pins apply: {selected}"
          expected = selected.pop().lstrip("=<>!~ ")
          actual = version("mindroom-nio")
          assert actual == expected, (actual, expected)
          print(f"mindroom-nio {actual}")
          PY

      - name: Prepare previous Matrix provider for store upgrade contract
        if: matrix.python-version == '3.12'
        run: |
          uv venv --python 3.12 .sdk-previous
          uv pip install --python .sdk-previous/bin/python 'mindroom-nio[e2e]==0.40.0'

      - name: Run tests with coverage
        env:
          MMRELAY_PREVIOUS_SDK_PYTHON: ${{ matrix.python-version == '3.12' && '.sdk-previous/bin/python' || '' }}
        run: |
          # Run full suite (including performance tests) now that they are fast and deterministic
          uv run --no-sync python -m pytest tests/ -v --cov --cov-report=xml --cov-report=html --junitxml=junit.xml

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jeremiah-k/meshtastic-matrix-relay
          flags: unittests
          name: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
